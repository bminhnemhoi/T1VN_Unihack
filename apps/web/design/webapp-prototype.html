<title>HụiSafe Web App</title>

<style>
/* Layout: "dòng thời gian" — the round rail is the navigation, the stage below is the one job of the selected round.
   Tokens from apps/web/DESIGN.md v4 (landing approved 12/11). Single light look by choice, like the landing. */
:root {
  --ivory: #f4f0e8; --paper: #fbf9f4; --ink: #201d1d; --ink-deep: #151313; --ink-2: #5a5555;
  --line: #dcd6cb; --mute: #a39d94; --dim: #8f8a82; --lime: #a1ff62; --red: #f84131; --red-ink: #c4271a;
  --red-soft: #ff6a5c; --forest: #17402e; --forest-soft: #d8ecd9; --soft: #ece7dd; --gx: 24px; --r: 16px; --r-in: 4px;
  --display: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --dur-tap: 120ms; --dur-ui: 180ms; --dur-state: 400ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-stamp: cubic-bezier(0.2, 1.6, 0.4, 1);
  color-scheme: light;
}
html, body { height: 100%; }
body { background: #d9d3c7; color: var(--ink); font: 400 15px/1.5 var(--body); letter-spacing: 0.005em; overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.demo :focus-visible, .panel.dark .btn:focus-visible, .peek:focus-visible, .verdict :focus-visible, .bondBar :focus-visible { outline-color: var(--ivory); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin: 0; text-wrap: balance; }

/* Review frame: desktop fills the window, phone mode shows the same app in a 390x844 frame. */
.shell { height: 100%; display: grid; place-items: stretch; }
.shell.phone { place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.app { position: relative; container: app / inline-size; background: var(--ivory); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; height: 100%; min-height: 0; overflow: hidden; overflow: clip; }
.shell.phone .demo { padding-inline: 24px; flex-wrap: wrap; row-gap: 8px; }
.shell.phone .demo .ctl { display: contents; }
.shell.phone .app { width: min(390px, 100%); height: min(844px, 100%); border-radius: 34px; box-shadow: 0 0 0 10px var(--ink), 0 40px 80px -30px rgba(32, 29, 29, 0.6); }

/* demo strip */
.demo { background: var(--ink); color: #e9e4da; display: flex; align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); font-size: 12.5px; min-height: 34px; }
.demo b { flex: none; font: 600 10.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; background: var(--ivory); color: var(--ink); padding: 4px 8px; border-radius: 3px; }
.demo span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demo .ctl { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; min-width: 0; }
.demo button { min-height: 26px; padding: 0 12px; border-radius: 3px; border: 1px solid #4a4545; background: transparent; color: #e9e4da; font: 500 11px var(--mono); letter-spacing: 0.04em; }
.demo button[aria-pressed='true'] { background: #e9e4da; color: var(--ink); border-color: #e9e4da; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; padding: 12px max(var(--gx), env(safe-area-inset-right, 0px)) 12px max(var(--gx), env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--ivory); }
.logo { font: 900 22px/1 var(--display); letter-spacing: -0.05em; display: inline-flex; align-items: center; text-decoration: none; color: var(--ink); min-height: 44px; }
.logo span { position: relative; }
.logo span i { position: absolute; left: 50%; bottom: -5px; width: 6px; height: 6px; margin-left: -4px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1.5px var(--lime); }
.tabs { display: flex; gap: 4px; }
.tabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 4px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.tabs a[aria-current='page'] { color: var(--ink); background: var(--soft); }
.health { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
.chip b { font: 500 12.5px var(--mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--forest); flex: none; }
.dot.warn { background: var(--red); }

/* circle header + round rail */
.ctx { padding: 16px max(var(--gx), env(safe-area-inset-right, 0px)) 0 max(var(--gx), env(safe-area-inset-left, 0px)); }
.ctxHead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.ctxHead h1 { font-size: 26px; }
.ctxHead small { color: var(--ink-2); font-size: 13px; }
.rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 12px 0 0; padding: 0 0 16px; list-style: none; position: relative; }
.rail button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 12px 12px; min-height: 74px; display: grid; gap: 4px; align-content: space-between; transition: transform var(--dur-tap), border-color var(--dur-ui); position: relative; }
.rail button:active { transform: scale(0.97); }
.rail .k { display: flex; justify-content: space-between; align-items: center; }
.rail .k em { font-style: normal; }
.rail strong { font: 700 15px var(--display); letter-spacing: -0.02em; }
.rail small { font: 400 11.5px var(--mono); color: var(--ink-2); }
.rail .done { background: var(--paper); }
.rail .now { background: var(--lime); border-color: var(--lime); }
.rail .later { background: transparent; border-style: dashed; }
.rail .later strong, .rail .later small { color: var(--ink-2); }
.rail button[aria-current='true'] { box-shadow: 0 0 0 2px var(--ink); }
.rail .flag { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.rail .live { font: 500 12px var(--mono); }

/* stage */
.view { min-height: 0; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; }
.view > .in { animation: viewIn var(--dur-ui) var(--ease-out); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
.view > .inL { animation: inL var(--dur-ui) var(--ease-out); }
.view > .inR { animation: inR var(--dur-ui) var(--ease-out); }
@keyframes inL { from { opacity: 0; transform: translateX(18px); } }
@keyframes inR { from { opacity: 0; transform: translateX(-18px); } }
.stage { display: grid; grid-template-columns: 1.15fr 1fr; align-items: start; gap: 16px; padding: 0 max(var(--gx), env(safe-area-inset-right, 0px)) 16px max(var(--gx), env(safe-area-inset-left, 0px)); height: 100%; min-height: 0; }
.panel { border-radius: var(--r); padding: 24px; min-width: 0; min-height: 0; display: grid; align-content: start; gap: 16px; }
.panel.dark { background: var(--ink); color: var(--ivory); overflow: clip; }
.panel.light { background: var(--paper); border: 1px solid var(--line); }
.panel h2 { font-size: 22px; }
.phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 12px; }
.phases li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 8px 8px; border-radius: 4px; background: #2d2a2a; color: var(--mute); transition: background var(--dur-state), color var(--dur-state); }
.phases li.on { background: var(--lime); color: var(--ink); font-weight: 600; }
.phases li.past { background: #3a3636; color: #d6cfc3; }
.clockRow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.clock { font: 500 34px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--ivory); }
.clock.low { color: var(--red-soft); }

.slip { position: relative; background: var(--paper); color: var(--ink); border-radius: var(--r-in); padding: 16px 24px 16px; display: grid; gap: 8px; background-image: repeating-linear-gradient(to bottom, transparent 0 31px, #e6e0d4 31px 32px); }
.slip label { color: var(--ink-2); }
.bidIn { display: flex; align-items: baseline; gap: 12px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: var(--r-in); background: var(--ivory); }
.bidIn input { width: 100%; min-width: 0; min-height: 56px; background: transparent; border: 0; font: 500 46px/1.1 var(--mono); outline: none; padding: 0; font-variant-numeric: tabular-nums; }
.bidIn input:focus-visible { outline: none; }
.bidIn:focus-within { box-shadow: 0 0 0 3px var(--ink); }
.bidIn:has(input:disabled) { background: transparent; border-style: dashed; }
.bidIn input:disabled { color: var(--ink); -webkit-text-fill-color: var(--ink); opacity: 1; }
.bidIn span { font: 400 13px var(--mono); color: var(--ink-2); }
.hint { font-size: 13px; color: var(--ink-2); min-height: 1.4em; }
.hint.err { color: var(--red-ink); font-weight: 600; }
.stamp { position: absolute; right: 16px; top: 42px; transform: rotate(-10deg) scale(1.8); opacity: 0; border: 3px solid var(--red); color: var(--red-ink); border-radius: 6px; padding: 8px 12px; font: 800 17px/1 var(--display); letter-spacing: -0.02em; text-align: center; background: color-mix(in srgb, var(--paper) 85%, transparent); pointer-events: none; transition: transform var(--dur-state) var(--ease-stamp), opacity 120ms; }
.stamp small { display: block; font: 500 10.5px var(--mono); margin-top: 4px; }
.stamp.on { opacity: 1; transform: rotate(-10deg) scale(1); }
.stamp.win { border-color: var(--forest); color: var(--forest); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 48px; padding: 0 32px; border: 0; border-radius: 4px; font: 600 15px/1 var(--body); transition: transform var(--dur-tap); text-decoration: none; }
.btn:active { transform: scale(0.97); }
.btn.lime { background: var(--lime); color: var(--ink); }
.btn.ink { background: var(--ink); color: var(--ivory); }
.btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* receipt rows */
.rc { margin: 0; display: grid; }
.rc div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.panel.dark .rc div { border-color: #3a3636; }
.rc dt, .rc dd { margin: 0; }
.rc dd { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.rc .big { border-bottom: 0; padding-top: 12px; align-items: baseline; }
.rc .big dt { font-weight: 600; }
.rc .big dd { font-size: 28px; font-weight: 500; }
.panel.dark .rc .big dd { color: var(--ivory); }
.rc .neg dd { color: var(--ink-2); }
.panel.dark .rc .neg dd { color: var(--mute); }

.who { margin: 0; padding: 0; list-style: none; display: grid; }
.who li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.panel.dark .who li { border-color: #3a3636; }
.who li:last-child { border: 0; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 500 11px var(--mono); background: var(--ink); color: var(--ivory); }
.panel.dark .av { background: #3a3636; }
.av.me { background: var(--ivory); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.tag { font: 500 10.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; background: var(--soft); color: var(--ink); white-space: nowrap; }
.tag.ok { background: var(--forest-soft); color: var(--forest); }
.tag.bad { background: var(--red); color: var(--ink); }
.tag.lime { background: var(--lime); }
.tag.dark { background: var(--ink); color: var(--ivory); }

.cascade { display: grid; gap: 8px; padding: 16px; border-radius: var(--r-in); background: #fff3ee; border: 1px solid #f3c9bd; }
.bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--soft); }
.bar i { display: block; height: 100%; transform-origin: left; animation: grow var(--dur-state) var(--ease-out) both; }
@keyframes grow { from { transform: scaleX(0); } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }

/* overview */
.ov { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); align-items: start; gap: 16px; padding: 16px max(var(--gx), env(safe-area-inset-right, 0px)) 16px max(var(--gx), env(safe-area-inset-left, 0px)); height: 100%; min-height: 0; }
.verdict, .stats { grid-column: 1 / -1; }
.verdict { background: var(--ink); color: var(--ivory); border-radius: var(--r); padding: 24px 24px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.verdict p { margin: 0; font: 700 clamp(22px, 2.6vw, 34px)/1.15 var(--display); letter-spacing: -0.03em; max-width: 30ch; }
.verdict p em { font-style: normal; text-decoration: underline 3px var(--lime); text-underline-offset: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.stats > div { padding: 16px 16px; display: grid; gap: 4px; border-left: 1px solid var(--line); min-width: 0; }
.stats > div:first-child { border-left: 0; }
.stats b { font: 500 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stats small { color: var(--ink-2); font-size: 12.5px; }
.circles, .feed { border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); min-height: 0; max-height: 100%; overflow: auto; }
.feed { padding: 16px 16px; display: grid; gap: 12px; align-content: start; }
.feed ol { margin: 0; padding: 0; list-style: none; display: grid; }
.feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 4px 0; align-items: end; }
.feed .av { width: 28px; height: 28px; font-size: 9.5px; }
.bub { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; background: var(--ivory); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: 13px; min-width: 0; }
.bub small { display: block; font: 500 10.5px var(--mono); color: var(--ink-2); }
.bub b { font: 500 12.5px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.circles a.add { grid-template-columns: 1fr auto; color: var(--ink-2); }
.circles a.add strong { font: 700 15px var(--display); color: var(--ink); }
.circles a { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr) auto; gap: 16px; align-items: center; padding: 16px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; transition: background var(--dur-ui); }
.circles a:last-child { border-bottom: 0; }
.circles a:hover { background: var(--ivory); }
.circles h3 { font-size: 18px; letter-spacing: -0.02em; }
.circles small { color: var(--ink-2); font-size: 12.5px; }
.strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
.strip i { height: 8px; border-radius: 3px; background: var(--soft); }
.strip i.d { background: var(--ink); }
.strip i.n { background: var(--lime); box-shadow: inset 0 0 0 1.5px var(--ink); }
.strip i.x { background: var(--red); }

/* ledger */
.lg { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: 16px max(var(--gx), env(safe-area-inset-right, 0px)) 16px max(var(--gx), env(safe-area-inset-left, 0px)); height: 100%; min-height: 0; }
.lgHead { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.lgHead h1 { font-size: 26px; }
.tableWrap { border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); overflow: auto; min-height: 0; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; font-size: 13.5px; }
th, td { padding: 12px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--paper); z-index: 1; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
tbody th { position: sticky; left: 0; background: var(--paper); z-index: 1; font-weight: 600; white-space: nowrap; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
td .v { font-family: var(--mono); font-variant-numeric: tabular-nums; display: block; }
td small { color: var(--ink-2); font-size: 11.5px; display: block; margin-top: 4px; }
td.win { background: #f0fbe6; }
td.miss { background: #fff3ee; }
td.cur { box-shadow: inset 2px 0 0 var(--ink); }
tfoot td, tfoot th { border-top: 1px solid var(--ink); border-bottom: 0; font-weight: 600; }
.lgFoot { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--ink-2); }

/* receipt (kỳ đã chốt): torn paper edges, dashed rules, the stamp lands on it */
.panel.receipt { position: relative; background: var(--paper); border-radius: 3px; padding: 24px 24px; gap: 12px; box-shadow: 0 22px 34px -26px rgba(32, 29, 29, 0.5); }
.receipt::before, .receipt::after { content: ''; position: absolute; left: 0; right: 0; height: 8px; background: radial-gradient(circle at 6px 8px, var(--paper) 6px, transparent 6.5px) 0 0 / 12px 8px repeat-x; }
.receipt::before { top: -8px; }
.receipt::after { bottom: -8px; transform: scaleY(-1); }
.receipt h2 { max-width: 16ch; }
.rh, .rf { display: flex; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.rh { border-bottom: 1px dashed var(--ink); padding-bottom: 12px; }
.rf { border-top: 1px dashed var(--ink); padding-top: 12px; font: 400 11.5px var(--mono); color: var(--ink-2); }
.receipt .stamp { top: 52px; }

/* story nav: phone only (bars + prev/next, swipe on the stage) */
.storyNav { display: none; }
.storyNav > button { min-width: 44px; min-height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font: 500 18px/1 var(--mono); transition: transform var(--dur-tap); }
.storyNav > button:active { transform: scale(0.94); }
.storyNav > button:disabled { opacity: 0.35; }
.snMid { display: grid; gap: 4px; text-align: center; min-width: 0; }
.bars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.bars button { border: 0; background: none; padding: 8px 0; min-height: 22px; }
.bars i { display: block; height: 4px; border-radius: 4px; background: var(--line); transition: height var(--dur-ui); }
.bars .done i { background: var(--ink); }
.bars .flagged i { background: var(--red); }
.bars .now i { background: var(--lime); box-shadow: inset 0 0 0 1px var(--ink); }
.bars button[aria-current='true'] i { height: 7px; }
.snMid strong { font: 700 15px/1 var(--display); }
.snMid small { font: 400 11.5px var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* bottom sheet (phone): pulled up from the bid panel */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(21, 19, 19, 0.45); opacity: 0; pointer-events: none; transition: opacity var(--dur-ui); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 84%; overflow: auto; overscroll-behavior: contain; background: var(--paper); border-radius: 22px 22px 0 0; padding: 8px 24px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -24px 40px -24px rgba(21, 19, 19, 0.5); transform: translateY(102%); visibility: hidden; transition: transform 320ms var(--ease-out), visibility 0s 320ms; display: grid; gap: 12px; }
.app.sheetOpen .scrim { opacity: 1; pointer-events: auto; }
.app.sheetOpen .sheet { transform: none; visibility: visible; transition: transform 320ms var(--ease-out), visibility 0s; }
.grab { display: block; width: 100%; min-height: 28px; padding: 0; border: 0; background: none; touch-action: none; cursor: grab; }
.grab::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto; }
.sheetHead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheetHead button { min-height: 44px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--line); background: var(--ivory); font-weight: 600; font-size: 13px; }

/* create circle: focus mode, one question per screen */
.cr { height: 100%; min-height: 0; width: 100%; max-width: 780px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px; padding: 24px max(var(--gx), env(safe-area-inset-right, 0px)) 24px max(var(--gx), env(safe-area-inset-left, 0px)); }

<script>
(() => {
  // ---------- numbers: micro-USDC integers, floor division like HuiMath ----------
  const U = 1_000_000;
  const C = 100 * U;
  const CAP3 = 3_287_671;          // docs/03 s8: maxBid(3), L = 2
  const fmt = (micro, min = 2) => {
    const v = micro / U;
    const s = v.toLocaleString('vi-VN', { minimumFractionDigits: min, maximumFractionDigits: 6 });
    return s;
  };
  // Round 3 if YOU win with bid b: live payers M2, M5 pay C - b; M1 (already received) pays C; M4 (defaulted) is covered by the bond.
  function round3Estimate(b) {
    const pot = 2 * (C - b) + C + C;
    const fee = Math.floor((pot * 100) / 10_000);       // feeBps 100, kept in escrow (round has a shortfall)
    const premium = Math.floor((pot * 100) / 10_000);   // reserveBps 100
    const hold = Math.floor((2000 * (5 - 3) * C) / 10_000); // alpha 20% x (N - k) x C
    return { pot, fee, premium, hold, payout: pot - fee - premium - hold };
  }
  function parseBid(str) {
    const s = String(str).trim().replace(/\./g, '').replace(',', '.');
    if (!/^\d+(\.\d{0,6})?$/.test(s)) return null;
    const [i, f = ''] = s.split('.');
    return Number(i) * U + Number((f + '000000').slice(0, 6));
  }
  const M2_BID = 2_500_000; // sample: M2 sealed 2,5 USDC

  // ---------- state ----------
  const freshC = () => ({ step: 0, mode: 'bidding', N: 5, C: '100', P: 30, created: false });
  const st = { view: 'tong-quan', round: 3, bid: '3,00', phase: 'commit', left: 78, sealed: false, revealed: false, settled: null, dir: 0, c: freshC(), lgMode: 'grid', lgRound: 3,
    net: 'ok', loaded: new Set(), pending: null, showSkel: false, err: null, refreshing: false, staleErr: false, tx: null };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const say = (m) => { const l = document.getElementById('live'); if (!l) return; l.textContent = ''; setTimeout(() => { l.textContent = m; }, 30); };

  // Create-circle numbers, same formulas as HuiMath (docs/03 s2.1, s2.3, s2.4, s2.6). BigInt: C up to 10 000 USDC overflows 2^53 otherwise.
  function createMath(N, Cm, P) {
    const n = BigInt(N), c = BigInt(Cm), p = BigInt(P);
    const omax = (n / 2n) * (n - n / 2n) * c;                       // floor(N/2)·ceil(N/2)·C
    const bond = (8000n * omax + 9999n) / 10000n;                   // ceil((10000 − α)·O_max / 10000), α = 20%
    let cap = (2000n * c * (n - 1n) * p) / 3_650_000n;              // capBps·C·(N−1)·P / (10000·365 days), round 1
    if (cap >= c) cap = c - 1n;

  const roundState = (k) => (k < 3 || (k === 3 && st.settled) ? 'done' : k === 3 ? 'now' : 'later');

          <div><dt>Giữ lại / quỹ dự phòng</dt><dd>20% / 1%</dd></div></dl>`;
    const txv = txUI('create', 'Gửi lại lệnh tạo dây');

  const nSub = (N) => `Dây có ${N} kỳ, mỗi người hốt đúng một lần. Từ 3 đến 30 người, tính cả bạn nếu bạn cũng chơi.`;

  // ---------- sheet (phone) ----------

  let drag = null;

  function stepRound(d) {

  // ---------- lamng-design-rule §1: loading, empty, error ----------
  const LAT = { ok: 60, slow: 2200, fail: 1600, empty: 60 };
  const NET = ['ok', 'slow', 'fail', 'empty'];
  const NET_LABEL = { ok: 'thường', slow: 'mạng chậm', fail: 'lỗi mạng', empty: 'tài khoản mới' };
  let reqId = 0;
  // Fetch the data behind a view. Shell first; indicator only after 180 ms; once shown it stays ≥ 300 ms.
  // Cached data stays on screen while it refreshes (stale-while-revalidate); a failed refresh keeps it and offers a retry.
  function fetchView(v) {
    const token = ++reqId;
    const cached = st.loaded.has(v);
    if (!cached) { st.pending = v; st.showSkel = false; st.err = null; render(false); }
    let shownAt = 0;
    const showT = setTimeout(() => {
      if (token !== reqId) return;
      shownAt = performance.now();
      if (cached) { st.refreshing = true; health(); } else { st.showSkel = true; render(false); say('Đang tải dữ liệu từ chuỗi…'); }
    }, 180);
    setTimeout(() => {
      if (token !== reqId) return;
      clearTimeout(showT);
      const finish = () => {
        if (token !== reqId) return;
        const failed = st.net === 'fail';
        st.refreshing = false;
        if (cached) { st.staleErr = failed; health(); if (failed) say('Chưa cập nhật được. Đang hiện dữ liệu cũ.'); return; }
        st.pending = null; st.showSkel = false;
        if (failed) { st.err = v; say('Chưa đọc được dữ liệu từ chuỗi.'); } else { st.loaded.add(v); st.err = null; if (shownAt) say('Đã tải xong.'); }
        render(true);
      };
      const held = shownAt ? performance.now() - shownAt : Infinity;
      if (held < 300) setTimeout(finish, 300 - held); else finish();
    }, LAT[st.net]);
  }
  function setNet(mode) {
    st.net = mode;
    $('#netMode').textContent = 'Thử: ' + NET_LABEL[mode];
    st.err = null; st.staleErr = false; st.tx = null;
    const keep = mode === 'fail' && st.loaded.has(st.view);
    st.loaded.clear();
    if (keep) st.loaded.add(st.view);
    say('Đang mô phỏng: ' + NET_LABEL[mode]);
    if (st.view === 'tao') render(false); else fetchView(st.view);
  }
  // Skeleton blocks match the measured size of the real blocks (1440: 126/104/277/417, 387/544; 390: 147/214/271, 480, 593).
  function skeleton(v) {
    if (v === 'tong-quan') return `<section class="ov" aria-hidden="true"><div class="sk skVerdict"></div><div class="sk skStats"></div><div class="sk skCircles"></div><div class="sk skFeed skSide"></div></section>`;

  const skelCtx = () => `<div class="ctx" aria-hidden="true"><div class="sk" style="height:28px;width:min(260px,60%);border-radius:var(--r-in)"></div>
    <div class="skRail">${'<div class="sk"></div>'.repeat(5)}</div><div class="sk skStory"></div></div>`;
  function emptyView(v) {
    const [h, p] = v === 'so-hui' ? ['Sổ hụi còn trống.', 'Sổ hụi hiện ra khi bạn vào một dây và dây bắt đầu.']
      : v === 'day' ? ['Chưa có dây nào để xem.', 'Khi bạn vào một dây, các kỳ của dây hiện ở đây.']
      : ['Bạn chưa ở dây hụi nào.', 'Tạo một dây cho nhóm của bạn, hoặc mở đường dẫn mời bạn bè gửi.'];
    return `<section class="state in"><div class="stateBox"><span class="label">Tài khoản mới</span><h2>${h}</h2><p>${p}</p>
      <div class="actions"><a class="btn lime" href="#tao">Tạo dây mới</a><button type="button" class="btn ghost" data-paste>Dán đường dẫn mời</button></div></div></section>`;
  }
  const errorView = () => `<section class="state in"><div class="stateBox" role="alert"><span class="label" style="color:var(--red-ink)">Lỗi mạng</span>
    <h2>Chưa đọc được dữ liệu từ chuỗi.</h2><p>Máy chủ đọc sự kiện đang chậm hoặc mạng chập chờn. Tiền của bạn vẫn nằm trong hợp đồng, không bị ảnh hưởng.</p>
    <div class="actions"><button type="button" class="btn ink" data-retry>Thử lại</button></div></div></section>`;
  const pasteForm = () => `<form class="field" id="pasteForm" novalidate><label for="inviteIn">Đường dẫn mời</label>
    <input id="inviteIn" type="url" inputmode="url" autocomplete="off" placeholder="https://huisafe.app/moi/…" aria-describedby="inviteHint">
    <p class="hint" id="inviteHint" style="margin:0">Dán đường dẫn bạn bè gửi qua Zalo hoặc Messenger.</p>
    <button class="btn ink" type="submit">Mở lời mời</button></form>`;

  // ---------- transactions: steps, never optimistic (the stamp lands only after confirmation) ----------
  const TX_STEPS = ['Ký', 'Gửi', 'Xác nhận'];
  const TX_TEXT = ['Đang chờ bạn ký', 'Đang gửi qua relay', 'Chờ xác nhận trên Fuji'];
  const TXD = { ok: [300, 400, 700], slow: [900, 1300, 2600], fail: [700, 1200, 0], empty: [300, 400, 700] };
  const TX_DONE = {
    seal: () => { st.sealed = true; st.justStamp = true; render(false); },
    reveal: () => { st.revealed = true; st.justStamp = true; render(false); },
    create: () => { st.c.created = true; st.justStamp = true; render(true); },
  };
  function txUI(kind, retryLabel) {
    const tx = st.tx;
    if (!tx || tx.kind !== kind) return null;
    const steps = `<ol class="txSteps" aria-label="Tiến độ giao dịch">${TX_STEPS.map((s, i) => `<li class="${i < tx.step ? 'done' : i === tx.step ? (tx.err ? 'fail' : 'now') : ''}">${i + 1}. ${s}${i === tx.step && tx.err ? ' · lỗi' : ''}</li>`).join('')}</ol>`;
    if (tx.err) return { btn: `<button class="btn lime" type="button" data-tx-retry="${kind}">${retryLabel}</button>`, extra: `${steps}<p class="hint err" role="alert" style="margin:0">${tx.err}</p>` };
    return { btn: `<button class="btn lime" type="button" disabled aria-busy="true"><span class="spin" aria-hidden="true"></span>${TX_TEXT[tx.step]} · ${tx.step + 1}/3</button>`, extra: steps };
  }
  async function runTx(kind, modeOverride) {
    if (st.tx && !st.tx.err) return;                    // locked: no double submit
    const mode = modeOverride || st.net;
    const d = TXD[mode] || TXD.ok;
    st.tx = { kind, step: 0, err: null };
    for (let i = 0; i < 3; i++) {
      if (!st.tx) return;
      st.tx.step = i;
      render(false);
      say(TX_TEXT[i] + '…');
      await wait(d[i]);
      if (!st.tx) return;
      if (mode === 'fail' && i === 1) {
        st.tx.err = kind === 'create' ? 'Gửi không được vì mạng lỗi. Dây chưa được tạo, bạn chưa mất gì.' : 'Gửi không được vì mạng lỗi. Lệnh chưa lên chuỗi, bạn chưa mất gì.';
        render(false);
        say(st.tx.err);
        return;
      }
    }
    st.tx = null;
    say('Đã xác nhận trên chuỗi.');
    TX_DONE[kind]();
  }

  // ---------- render ----------
  function render(anim = true) {
    const v = st.view;
    document.querySelectorAll('[data-nav]').forEach((a) => a.setAttribute('aria-current', a.dataset.nav === v ? 'page' : 'false'));
    health();
    // lamng-design-rule §1: every view has 4 states — loading (skeleton), empty, error, data.
    const busy = v !== 'tao' && st.pending === v;
    $('#view').setAttribute('aria-busy', String(busy));
    let html = '';
    if (busy) { $('#ctx').innerHTML = v === 'day' && st.showSkel ? skelCtx() : ''; html = st.showSkel ? skeleton(v) : ''; }
    else if (v !== 'tao' && st.err === v) { $('#ctx').innerHTML = ''; html = errorView(); }
    else if (v !== 'tao' && st.net === 'empty') { $('#ctx').innerHTML = ''; html = emptyView(v); }
    else {
      $('#ctx').innerHTML = v === 'day' ? rail() : '';
      if (v === 'tong-quan') html = viewOverview();
      else if (v === 'so-hui') html = viewLedger();
      else if (v === 'tao') html = viewCreate();
      else html = st.round === 3 ? stageNow() : st.round < 3 ? stageDone(st.round) : stageLater(st.round);
    }
    $('#view').innerHTML = html;
    // Typing in the bid box re-renders the numbers only: cancel the view entrance before it paints.
    if (!anim) $('#view').querySelectorAll('.in').forEach((n) => n.classList.remove('in'));
    else if (st.dir) { const f = $('#view').firstElementChild; f?.classList.replace('in', st.dir > 0 ? 'inL' : 'inR'); }
    st.dir = 0;
    // A stamp that just happened lands once (MOTION.md B3, 400 ms stamp ease); otherwise it is simply there.
    const s = $('.stamp.on');
    if (st.justStamp && s) { s.classList.remove('on'); void s.offsetWidth; s.classList.add('on'); }
    st.justStamp = false;
  }

  function go() {
    const h = location.hash.replace('#', '');
    st.view = ['tong-quan', 'day', 'so-hui', 'tao'].includes(h) ? h : 'tong-quan';
    closeSheet(false);
    if (st.view === 'tao') { render(); return; }
    if (st.loaded.has(st.view)) render();
    fetchView(st.view);
  }

  // ---------- events ----------
  app.addEventListener('click', (e) => {
    const r = e.target.closest('[data-round]');
    if (r) { st.round = Number(r.dataset.round); render(); return; }
    if (e.target.closest('#seal')) { runTx('seal'); return; }
    if (e.target.closest('#reveal')) { runTx('reveal'); return; }
    const txr = e.target.closest('[data-tx-retry]');
    if (txr) { st.tx = null; runTx(txr.dataset.txRetry, 'ok'); return; }
    if (e.target.closest('[data-retry]')) { say('Đang thử lại…'); setNet('ok'); return; }
    const pb = e.target.closest('[data-paste]');
    if (pb) { openSheet('Mở lời mời', pasteForm(), pb); $('#inviteIn')?.focus({ preventScroll: true }); return; }
    if (e.target.closest('#netMode')) { setNet(NET[(NET.indexOf(st.net) + 1) % NET.length]); return; }
    const sr = e.target.closest('[data-step-round]');
    if (sr) { stepRound(Number(sr.dataset.stepRound)); return; }
    const cb = e.target.closest('[data-c]');
    if (cb) { handleCreate(cb.dataset.c); return; }
    if (e.target.closest('#openSheet')) { openSheet(); return; }
    const lm = e.target.closest('[data-lg-mode]');
    if (lm) { lgSet(() => { st.lgMode = lm.dataset.lgMode; }); return; }
    const lk = e.target.closest('[data-lg-k]');
    if (lk) { const k = Number(lk.dataset.lgK); lgSet(() => { st.lgRound = k; }, Math.sign(k - st.lgRound)); return; }
    const ls = e.target.closest('[data-lg-step]');
    if (ls) { lgStep(Number(ls.dataset.lgStep)); return; }
    const cell = e.target.closest('[data-lg-cell]');
    if (cell) { const [m, k] = cell.dataset.lgCell.split(':'); openSheet(`${m === 'M3' ? 'Bạn (M3)' : m} · Kỳ ${k}`, cellSheet(m, Number(k)), cell); return; }
    const goto = e.target.closest('[data-lg-goto]');
    if (goto) { closeSheet(false); lgSet(() => { st.lgMode = 'round'; st.lgRound = Number(goto.dataset.lgGoto); }); return; }
    if (e.target.closest('#scrim, #closeSheet')) { closeSheet(); return; }
  });
  app.addEventListener('submit', (ev) => {
    if (ev.target.id !== 'pasteForm') return;
    ev.preventDefault();
    const inp = $('#inviteIn'), hint = $('#inviteHint');
    const ok = /^https?:\/\/\S+$/.test(inp.value.trim());
    inp.setAttribute('aria-invalid', String(!ok));
    hint.classList.toggle('err', !ok);
    hint.textContent = ok ? 'Bản xem thử: chưa mở được lời mời thật.' : 'Chưa đúng đường dẫn. Dán nguyên đường dẫn bắt đầu bằng https://';
  });
  app.addEventListener('keydown', (ev) => {
    const pressed = ev['key'];
    if (pressed === 'Escape') closeSheet();
    if (pressed === 'Enter' && ev.target.id === 'cIn') $('[data-c="next"]')?.click();
  });
  // Swipe between rounds on the circle stage (phone): horizontal only, never from a control.
  let sw = null;
  $('#view').addEventListener('pointerdown', (e) => {
    const swipeable = st.view === 'day' || (st.view === 'so-hui' && st.lgMode === 'round');
    sw = swipeable && !e.target.closest('input, button, a, .tableWrap') ? { x: e.clientX, y: e.clientY } : null;
  });
  $('#view').addEventListener('pointerup', (e) => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    sw = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) (st.view === 'so-hui' ? lgStep : stepRound)(dx < 0 ? 1 : -1);
  });
  app.addEventListener('input', (e) => {
    if (e.target.id === 'nRange') {
      st.c.N = Number(e.target.value);
      $('.stepper output').textContent = st.c.N;
      $('[data-c="N:-1"]').disabled = st.c.N <= 3;
      $('[data-c="N:1"]').disabled = st.c.N >= 30;
      $('#nSub').textContent = nSub(st.c.N);
      return;
    }
    if (e.target.id === 'cIn') {
      st.c.C = e.target.value.trim();
      const Cm = parseBid(st.c.C), ok = Cm !== null && Cm >= U && Cm <= 10_000 * U;
      $('#cHint').textContent = createHint(st.c.N, Cm, ok);
      $('#cHint').classList.toggle('err', !ok);
      e.target.setAttribute('aria-invalid', String(!ok));
      $('[data-c="next"]').disabled = !ok;
      document.querySelectorAll('.chips [data-c]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.c === 'C:' + st.c.C)));
      return;
    }
    if (e.target.id !== 'bid') return;
    st.bid = e.target.value;
    // Update the estimate and the button without rebuilding the input (keeps the caret).
    const pos = e.target.selectionStart;
    render(false);
    const input = $('#bid');
    if (input) { input.focus(); try { input.setSelectionRange(pos, pos); } catch {} }
  });
  $('#ffwd').addEventListener('click', () => {
    if (st.settled) return;
    if (st.phase === 'commit') { st.phase = 'reveal'; st.left = 0; }
    else if (st.phase === 'reveal') {
      const b = st.sealed && st.revealed ? parseBid(st.bid) : null;
      const youWin = b !== null && b > M2_BID; // ties go to fewer late payments, then earlier commit (M2)
      st.settled = youWin ? { who: 'Bạn', bid: b, payout: round3Estimate(b).payout } : { who: 'M2', bid: M2_BID, payout: round3Estimate(M2_BID).payout };
      st.phase = 'done';
      st.round = 3;
      st.justStamp = true;
    }
    if (location.hash !== '#day') location.hash = '#day'; else render();
  });
  $('#frameToggle').addEventListener('click', (ev) => {
    const phone = !$('#shell').classList.contains('phone');
    $('#shell').classList.toggle('phone', phone);
    ev.currentTarget.textContent = phone ? 'Xem: máy tính' : 'Xem: điện thoại';
  });

  // Countdown: only the digits change (no flip, no bounce), MOTION.md B3.
  setInterval(() => {
    if (st.phase !== 'commit' || st.settled || st.left <= 0) return;
    st.left -= 1;
    const c = $('#clock');
    if (c) { c.textContent = clock(st.left); c.classList.toggle('low', st.left <= 30); }
    const live = document.querySelector('.rail .now small');
    if (live) live.textContent = `còn ${clock(st.left)}`;
    const sub = $('#snSub');
    if (sub && st.round === 3) sub.textContent = roundSub(3);
    if (st.left === 0) { st.phase = 'reveal'; render(false); }
  }, 1000);

  setInterval(() => { if (st.view !== 'tao' && st.loaded.has(st.view) && !st.pending && !st.tx && st.net !== 'empty') fetchView(st.view); }, 20000);
  window.addEventListener('hashchange', go);
  go();
})();
</script>
